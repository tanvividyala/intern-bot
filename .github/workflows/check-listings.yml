name: Check internship listings

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run listing check (Tanvi's board)
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py --config config.yaml

      - name: Run listing check (Vedh's board)
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL_VEDH: ${{ secrets.DISCORD_WEBHOOK_URL_VEDH }}
        run: python main.py --config config.vedh.yaml --webhook-env DISCORD_WEBHOOK_URL_VEDH

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "intern-bot"
          git config user.email "actions@github.com"
          git add state/seen_jobs.json state/seen_jobs.vedh.json
          git diff --cached --quiet || git commit -m "Update seen jobs state"
          git push
